server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;
  location / {
    try_files $uri $uri/ /index.html;
  }
  # index.html must always be revalidated so a new build's hashed assets load
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
